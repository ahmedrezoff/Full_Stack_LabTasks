<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facebook Home Feed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container mx-auto position-relative shadow">
      <!-- Top Header -->
      <header class="d-flex justify-content-between align-items-center px-3 py-2 bg-white">
        <div class="logo">facebook</div>
        <div class="d-flex gap-2">
          <div class="icon-circle">🔍</div>
          <div class="icon-circle">💬</div>
        </div>
      </header>

      <!-- Status Update Area -->
      <div class="d-flex align-items-center gap-2 px-3 py-2 bg-white">
        <img
          src="images/The perfect Man!.jpg"
          alt="Profile"
          class="profile-pic rounded-circle"
        />
        <input type="text" class="form-control rounded-pill flex-grow-1" placeholder="What's on your mind?" />
        <div class="fs-4">🖼️</div>
      </div>

      <!-- Quick Actions -->
      <div class="d-flex gap-2 px-3 py-2 bg-white border-top quick-actions">
        <div class="action-btn">🎬 Reel</div>
        <div class="action-btn">🎥 Room</div>
        <div class="action-btn">👥 Group</div>
        <div class="action-btn">🔴 Live</div>
      </div>

      <!-- Stories Section -->
      <div class="d-flex gap-2 p-3 bg-white stories-container">
        <!-- My Story -->
        <div class="story my-story rounded-3">
          <img src="images/The perfect Man!.jpg" alt="Me" class="story-bg" />
          <div class="story-footer">
            <div class="add-btn rounded-circle">+</div>
            <span>Create a Story</span>
          </div>
        </div>

        <!-- Friend Stories -->
        <div class="story rounded-3">
          <img src="images/download (1).jpg" alt="Story" class="story-bg" />
          <img src="images/download (1).jpg" alt="Profile" class="story-profile rounded-circle" />
          <span class="story-author">Shehzad</span>
        </div>

        <div class="story rounded-3">
          <img src="images/download (2).jpg" alt="Story" class="story-bg" />
          <img src="images/download (2).jpg" alt="Profile" class="story-profile rounded-circle" />
          <span class="story-author">Sarim</span>
        </div>

        <div class="story rounded-3">
          <img src="images/download (3).jpg" alt="Story" class="story-bg" />
          <img src="images/download (3).jpg" alt="Profile" class="story-profile rounded-circle" />
          <span class="story-author">Rafiullah</span>
        </div>
      </div>

      <!-- Feed Post -->
      <div class="post bg-white pt-2 mb-3">
        <div class="d-flex align-items-center px-3 pb-2">
          <img src="images/download.jpg" alt="User" class="profile-pic rounded-circle" />
          <div class="ms-2 flex-grow-1">
            <strong class="d-block">Cassandra Taylor</strong>
            <span class="post-time">8h • 🌎</span>
          </div>
          <div class="post-options">...</div>
        </div>
        <div>
          <img src="images/download.jpg" alt="Post Image" class="feed-image w-100" />
        </div>
      </div>

      <!-- Blue Tooltip Popup -->
      <div class="tooltip-box bg-primary text-white p-3 mx-3 rounded-3 small fw-bold">
        Filter through the latest posts from your friends, groups, Pages and
        more.
      </div>

      <!-- Bottom Navigation -->
      <nav class="d-flex justify-content-between bg-white border-top bottom-nav">
        <div class="nav-item active">
          <div class="nav-icon">🏠</div>
          <span>Home</span>
        </div>
        <div class="nav-item">
          <div class="nav-icon">📺</div>
          <span>Watch</span>
        </div>
        <div class="nav-item">
          <div class="nav-icon">📰</div>
          <span>Feeds</span>
        </div>
        <div class="nav-item">
          <div class="nav-icon">👥</div>
          <span>Groups</span>
        </div>
        <div class="nav-item">
          <div class="nav-icon">🔔</div>
          <span>Notifications</span>
        </div>
        <div class="nav-item">
          <div class="nav-icon">☰</div>
          <span>Menu</span>
        </div>
      </nav>
    </div>
  </body>
</html>
