<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facebook Home Feed</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Top Header -->
      <header class="top-bar">
        <div class="logo">facebook</div>
        <div class="header-icons">
          <div class="icon-circle">🔍</div>
          <div class="icon-circle">💬</div>
        </div>
      </header>

      <!-- Status Update Area -->
      <div class="status-update">
        <img
          src="images/The perfect Man!.jpg"
          alt="Profile"
          class="profile-pic"
        />
        <input type="text" placeholder="What's on your mind?" />
        <div class="gallery-icon">🖼️</div>
      </div>

      <!-- Quick Actions -->
      <div class="quick-actions">
        <div class="action-btn"><span>🎬</span> Reel</div>
        <div class="action-btn"><span>🎥</span> Room</div>
        <div class="action-btn"><span>👥</span> Group</div>
        <div class="action-btn"><span>🔴</span> Live</div>
      </div>

      <!-- Stories Section -->
      <div class="stories-container">
        <!-- My Story -->
        <div class="story my-story">
          <img src="images/The perfect Man!.jpg" alt="Me" class="story-bg" />
          <div class="story-footer">
            <div class="add-btn">+</div>
            <span>Create a Story</span>
          </div>
        </div>

        <!-- Friend Stories -->
        <div class="story">
          <img src="images/download (1).jpg" alt="Story" class="story-bg" />
          <img
            src="images/download (1).jpg"
            alt="Profile"
            class="story-profile"
          />
          <span class="story-author">Shehzad</span>
        </div>

        <div class="story">
          <img src="images/download (2).jpg" alt="Story" class="story-bg" />
          <img
            src="images/download (2).jpg"
            alt="Profile"
            class="story-profile"
          />
          <span class="story-author">Sarim</span>
        </div>

        <div class="story">
          <img src="images/download (3).jpg" alt="Story" class="story-bg" />
          <img
            src="images/download (3).jpg"
            alt="Profile"
            class="story-profile"
          />
          <span class="story-author">Rafiullah</span>
        </div>
      </div>

      <!-- Feed Post -->
      <div class="post">
        <div class="post-header">
          <img src="images/download.jpg" alt="User" class="profile-pic" />
          <div class="post-info">
            <strong class="author-name">Cassandra Taylor</strong>
            <span class="post-time">8h • 🌎</span>
          </div>
          <div class="post-options">...</div>
        </div>
        <div class="post-content">
          <img src="images/download.jpg" alt="Post Image" class="feed-image" />
        </div>
      </div>

      <!-- Blue Tooltip Popup -->
      <div class="tooltip">
        Filter through the latest posts from your friends, groups, Pages and
        more.
      </div>

      <!-- Bottom Navigation -->
      <nav class="bottom-nav">
        <div class="nav-item active">
          <div class="nav-icon">🏠</div>
          <span>Home</span>
        </div>
        <div class="nav-item">
          <div class="nav-icon">📺</div>
          <span>Watch</span>
        </div>
        <div class="nav-item">
          <div class="nav-icon">📰</div>
          <span>Feeds</span>
        </div>
        <div class="nav-item">
          <div class="nav-icon">👥</div>
          <span>Groups</span>
        </div>
        <div class="nav-item">
          <div class="nav-icon">🔔</div>
          <span>Notifications</span>
        </div>
        <div class="nav-item">
          <div class="nav-icon">☰</div>
          <span>Menu</span>
        </div>
      </nav>
    </div>
  </body>
</html>
