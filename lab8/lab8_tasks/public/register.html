<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account — Wheeler, Rawson &amp; Co.</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&amp;family=Merriweather:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="assets/style.css" rel="stylesheet" />
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-vintage fixed-top py-2">
  <div class="container-xl">
    <a class="navbar-brand" href="index.html">Wheeler, Rawson &amp; Co.<small>General Merchandise — Est. 1899</small></a>
    <div class="d-flex align-items-center gap-3 ms-auto">
      <a class="btn btn-vintage-outline d-flex align-items-center gap-2" href="cart.html">
        Cart <span class="badge bg-danger rounded-pill" id="nav-cart-badge">0</span>
      </a>
    </div>
  </div>
</nav>

<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-11 col-sm-9 col-md-7 col-lg-5">
      <div class="card-vintage">
        <div class="card-header text-center py-3">
          <div class="small text-ink-muted text-uppercase">New Patron Registration</div>
          <h1 class="h4 mb-0">Create Account</h1>
        </div>
        <div class="card-body p-4">
          <form onsubmit="event.preventDefault(); alert('Account created.'); window.location.href='login.html';">
            <div class="mb-3">
              <label class="form-label" for="regName">Full Name</label>
              <input class="form-control" id="regName" required placeholder="e.g. John Marston">
            </div>
            <div class="mb-3">
              <label class="form-label" for="regEmail">Email Address</label>
              <input class="form-control" id="regEmail" type="email" required placeholder="name@post.net">
            </div>
            <div class="mb-3">
              <label class="form-label" for="regPassword">Password</label>
              <input class="form-control" id="regPassword" type="password" required placeholder="••••••••">
            </div>
            <div class="mb-3">
              <label class="form-label" for="regConfirm">Confirm Password</label>
              <input class="form-control" id="regConfirm" type="password" required placeholder="••••••••">
            </div>
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="regTerms" required>
              <label class="form-check-label" for="regTerms">I agree to the terms of sale</label>
            </div>
            <button class="btn btn-vintage w-100 py-2" type="submit">Register Account</button>
            <p class="text-center small mt-3 mb-0">Already have an account? <a href="login.html">Sign in here</a></p>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="footer-vintage py-4 mt-5">
  <div class="container-xl text-center small">&copy; 1899 Wheeler, Rawson &amp; Co. All Rights Reserved.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/cart.js"></script>
</body>
</html>
